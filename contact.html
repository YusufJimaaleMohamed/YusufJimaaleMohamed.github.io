<!doctype html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Yusuf Portfolio</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="main.css" rel="stylesheet">
</head>

<body class="project-body">

<nav class="project-nav">
  <div class="container d-flex justify-content-between align-items-center">
    <strong>Yusuf Portfolio</strong>
    <a href="index.html">← Terug</a>
  </div>
</nav>

<section class="project-detail">
  <div class="container">

    <div class="project-title text-center">
      <h1>Contact</h1>
      <p>Wil je mij bereiken? Stuur mij hieronder een bericht.</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-8">

        <form id="contact-form" class="contact-form-card">

          <div class="mb-3 text-start">
            <label class="form-label">Naam</label>
            <input type="text" class="form-control" name="name" required>
          </div>

          <div class="mb-3 text-start">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" name="email" required>
          </div>

          <div class="mb-3 text-start">
            <label class="form-label">Onderwerp</label>
            <input type="text" class="form-control" name="title" required>
          </div>

          <div class="mb-3 text-start">
            <label class="form-label">Bericht</label>
            <textarea class="form-control" name="message" rows="6" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100">
            Verstuur bericht
          </button>

        </form>

      </div>
    </div>

  </div>
</section>

<footer class="project-footer">
  © 2026 Yusuf Mohamed
</footer>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
  emailjs.init({
    publicKey: "cNyLaQdq5zxOSoENX"
  });

  document.getElementById("contact-form").addEventListener("submit", function(e){

    e.preventDefault();

    emailjs.sendForm(
            "service_0tf0ojy",
            "template_vxf3iot",
            this
    ).then(function(){

      alert(" Bericht succesvol verstuurd!");
      document.getElementById("contact-form").reset();

    }).catch(function(error){

      console.log(error);
      alert(" Er ging iets fout.");

    });

  });
</script>

</body>
</html>
